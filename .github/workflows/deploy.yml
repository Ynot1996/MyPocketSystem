name: CI / Deploy

# - Every pull request into main runs the test suite (fast feedback before review).
# - Pushes to main run the tests again and, only if they pass, deploy to Azure.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  AZURE_WEBAPP_NAME: mypocket-web-app
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: MyPocket.Web/MyPocket.Web.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        # Targets the test project directly to avoid pulling in MyPocket.Mobile (MAUI).
        run: dotnet test MyPocket.Tests/MyPocket.Tests.csproj -c Release --logger "console;verbosity=normal"

  deploy:
    needs: test
    # Never deploy from a PR — only from commits that landed on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
